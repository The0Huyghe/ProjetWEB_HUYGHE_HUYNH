        <meta charset="UTF-8">

        <title>STS2 - Formulaire modification</title>

    <body background="../img/Background.png">
        
        <header>
            

            <nav>
                <a class="bouton" href="../index.html">Accueil</a>
                <a class="bouton" href="./personnages.html">les personnages</a>
                <a class="bouton" href="./evenements.html">les évênements</a>
                <a class="bouton" href="./actes.html">les actes</a>
                <a class="bouton" href="./proposition_modif.html">proposition de modification</a>
                <a class="bouton" href="./a_propos.html">A propos</a>
            </nav>
        </header>
        <main>
        <h1>
            submit bouton -> clear toute la page
            chatbox 
        </h1>


        <section>
            <fieldset>
                <form id="Formulaire">
                    <ul>
                        <li>
                            <label for="email"> Adresse mail :</label>
                            <input type="email" id="email" name="user_email"/>
                        </li>

                        <li>
                            <label for="objet"> Objet de la demande : </label>
                            <input type="text" id="objet" name="email_objet"/>
                        </li>
                    </ul>
                </form>
            </fieldset>

            <fieldset>
                <form>
                
                    <input type="radio" id="info_errone" name="info_errone" value="1" onclick="radioclick(this.value);clearRadio(['2','21','22','23','24']);">
                    <label for="info_errone">Informations erronées</label>

                    <input type="radio" id="oubli" name="oubli" value="2" onclick="radioclick(this.value);clearRadio(['1','11','12','13','14']);">
                    <label for="autre">Oublis de données</label>

                    <div id="option_info_errone" class="sous-options" style="display: none;">
                        
                        <input type="radio" id="erreur_acte" name="erreur_acte" value="11" onclick="clearRadio(['12','13','14']);">
                        <label for="radioA">Actes</label>
                        
                        <input type="radio" id="erreur_boutique" name="erreur_boutique" value="12" onclick="clearRadio(['11','13','14']);">
                        <label for="radioB">Boutique</label>
                        
                        <input type="radio" id="erreur_evenement" name="erreur_evenement" value="13" onclick="clearRadio(['11','12','14']);">
                        <label for="radioB">Evenements</label>
                        
                        <input type="radio" id="erreur_personnage" name="erreur_personnage" value="14" onclick="clearRadio(['11','12','13']);">
                        <label for="radioB">Personnages</label>
                        
                    </div>
                    
                    <div id="option_oubli" class="sous-options" style="display: none;">
                        
                        <input type="radio" id="oubli_acte" name="oubli_acte" value="21" onclick="clearRadio(['22','23','24']);">
                        <label for="radioA">Actes</label>
                        
                        <input type="radio" id="oubli_boutique" name="oubli_boutique" value="22" onclick="clearRadio(['21','23','24']);">
                        <label for="radioB">Boutique</label>
                        
                        <input type="radio" id="oubli_evenement" name="oubli_evenement" value="23" onclick="clearRadio(['21','22','24']);">
                        <label for="radioB">Evenements</label>
                        
                        <input type="radio" id="oubli_personnage" name="oubli_personnage" value="24" onclick="clearRadio(['21','22','23']);">
                        <label for="radioB">Personnages</label>
                        
                    </div>

                    
                </form>
            </fieldset>
            <fieldset>
                <form id="Formulaire">

                    <label for="commentaire"> Précisions : </label>
                    <textarea id="Formulaire" name="commentaire" rows="4" cols="60" placeholder="Écrivez les modifications souhaitées ici..."></textarea>

                    <p id="message"></p>

                </form>
            </fieldset>
            <button type="button" onclick="radioclick(0);clearRadio(['2','21','22','23','24','1','11','12','13','14']);envoyerFormulaire();clearFormulaire();">
                Envoyer le formulaire
            </button>
                
            
        </section>

        </main>
